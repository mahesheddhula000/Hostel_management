<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard | Hostel Care</title><link rel="stylesheet" href="css/style.css"><script src="js/script.js" defer></script></head>
<body class="admin-page"><header class="admin-header"><div class="admin-brand">Hostel<span>Care</span></div><div class="admin-user"><span>Administrator</span><a href="index.html">Home</a></div></header>
<main class="admin-container"><section class="admin-welcome"><div><h1>Admin Dashboard</h1><p>Manage student complaints and maintenance requests.</p></div></section>
<section class="admin-stats"><div class="admin-stat"><p>Total Complaints</p><h2 id="adminTotal">0</h2></div><div class="admin-stat"><p>Pending</p><h2 id="adminPending">0</h2></div><div class="admin-stat"><p>In Progress</p><h2 id="adminProgress">0</h2></div><div class="admin-stat"><p>Resolved / Closed</p><h2 id="adminResolved">0</h2></div></section>
<section class="admin-complaints"><h2>All Student Complaints</h2><div class="admin-filters"><input type="search" id="adminSearch" placeholder="Search by student name, ID or complaint title..."><select id="adminStatusFilter"><option value="All">All Statuses</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Resolved">Resolved</option><option value="Closed">Closed</option></select></div>
<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Complaint ID</th><th>Student</th><th>Student ID</th><th>Room</th><th>Category</th><th>Complaint</th><th>Priority</th><th>Assign Staff</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminComplaintList"></tbody></table></div><p id="adminEmptyMessage" class="admin-empty">No complaints found.</p><p id="adminMessage" role="status" aria-live="polite"></p></section></main></body></html>
